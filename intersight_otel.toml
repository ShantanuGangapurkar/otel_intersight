

[[tspollers]]
name = "intersight_blade_host_power"
datasource = "PhysicalEntities"
dimensions = ["name","host.name", "host.id", "host.type"]
filter = { type = "and", fields = [{type = "selector", dimension = "instrument.name", value = "hw.host"}, {type= "selector", dimension= "host.type", value= "compute.Blade"}]}
aggregations = [
{type = "longSum", name = "count", fieldName = "hw.host.power_count"},
{type = "doubleSum", name = "hw.host.power-Sum", fieldName = "hw.host.power"},
{type= "doubleMin", name= "intersight.blade.host.power.min.watts", fieldName= "hw.host.power_min"},
{type= "doubleMax", name= "intersight.blade.host.power.max.watts", fieldName= "hw.host.power_max"}
]
post_aggregations = [{"type" = "expression", "name" = "intersight.blade.host.power.avg.watts", "expression" = "(\"hw.host.power-Sum\" / \"count\")"}]
field_names = ["intersight.blade.host.power.avg.watts","intersight.blade.host.power.min.watts","intersight.blade.host.power.max.watts"]
otel_dimension_to_attribute_map = { "name" = "intersight.name", "host.name" = "intersight.host.name", "host.type" = "intersight.host.type","host.id" = "intersight.host.id"}
otel_attributes = { "intersight.account.name" = "POD_NAME"}
interval = 60


[[tspollers]]
name = "intersight_blade_active_cpu_utilization"
datasource = "PhysicalEntities"
dimensions = ["host.name", "host.id", "host.type"]
filter = { type = "and", fields = [{type = "selector", dimension = "instrument.name", value = "hw.cpu"}, {type= "selector", dimension= "host.type", value= "compute.Blade"}]}
aggregations = [
{type = "longSum", name = "intersight.blade.cpu.utilization.count", fieldName = "hw.cpu.utilization_c0_count"},
{type = "doubleSum", name = "intersight.blade.cpu.utilization.sum", fieldName = "hw.cpu.utilization_c0"},
{type= "doubleMin", name= "intersight.blade.cpu.utilization.min", fieldName= "hw.cpu.utilization_c0_min"},
{type= "doubleMax", name= "intersight.blade.cpu.utilization.max", fieldName= "hw.cpu.utilization_c0_max"}
]
post_aggregations = [{"type" = "expression", "name" = "intersight.blade.cpu.utilization.avg", "expression" = "(\"intersight.blade.cpu.utilization.sum\" / \"intersight.blade.cpu.utilization.count\")"}]
field_names = ["intersight.blade.cpu.utilization.avg","intersight.blade.cpu.utilization.min","intersight.blade.cpu.utilization.max"]
otel_dimension_to_attribute_map = { "host.name" = "intersight.host.name", "host.type" = "intersight.host.type","host.id" = "intersight.host.id"}
otel_attributes = { "intersight.account.name" = "POD_NAME"}
interval = 60


[[tspollers]]
name = "intersight_blade_host_power_state"
datasource = "PhysicalEntities"
dimensions = ["host.name", "host.id", "host.type"]
filter = { type = "and", fields = [{type = "selector", dimension = "instrument.name", value = "hw.host"}, {type= "selector", dimension= "host.type", value= "compute.Blade"}]}
aggregations = [
{type = "longLast", name = "intersight.blade.host.power.state", fieldName = "hw.host.power_state"},
{type = "thetaSketch", name = "intersight.blade.host.power.state.count", fieldName = "host.id"}
]
field_names = ["intersight.blade.host.power.state"]
otel_dimension_to_attribute_map = {"host.name" = "intersight.host.name", "host.type" = "intersight.host.type","host.id" = "intersight.host.id"}
otel_attributes = { "intersight.account.name" = "POD_NAME"}
interval = 60


[[tspollers]]
name = "intersight_blade_temp_sensor"
datasource = "PhysicalEntities"
dimensions = ["host.name", "host.id", "host.type","hw.temperature.sensor.name"]
filter = { type = "and", fields = [{type = "selector", dimension = "instrument.name", value = "hw.temperature"}, {type= "selector", dimension= "host.type", value= "compute.Blade"},{type = "in", dimension = "hw.temperature.sensor.name", values = ["P1_TEMP_SENS","P2_TEMP_SENS","TEMP_FRONT","TEMP_REAR_BOT","TEMP_REAR_TOP","TEMP_REAR_MID"]}]}
aggregations = [
{type = "longSum", name = "intersight.blade.temp.sensor.count", fieldName = "hw.temperature_count"},
{type = "doubleSum", name = "hw.temperature-Sum", fieldName = "hw.temperature"},
{type= "doubleMin", name= "intersight.blade.temperature.min.celsius", fieldName= "hw.temperature_min"},
{type= "doubleMax", name= "intersight.blade.temperature.max.celsius", fieldName= "hw.temperature_max"}
]
post_aggregations = [{"type" = "expression", "name" = "intersight.blade.temperature.avg.celsius", "expression" = "(\"hw.temperature-Sum\" / \"intersight.blade.temp.sensor.count\")"}]
field_names = ["intersight.blade.temperature.avg.celsius","intersight.blade.temperature.min.celsius","intersight.blade.temperature.max.celsius"]
otel_dimension_to_attribute_map = { "host.name" = "intersight.host.name", "host.type" = "intersight.host.type","host.id" = "intersight.host.id","hw.temperature.sensor.name" = "intersight.blade.temperature.sensor"}
otel_attributes = { "intersight.account.name" = "POD_NAME"}
interval = 60


