[[tspollers]]
name = "intersight_fi_network_bandwidth_utilization"
datasource = "NetworkInterfaces"
dimensions = ["host.name","host.id", "host.type"]
filter = { type = "and", fields = [{type = "selector", dimension = "instrument.name", value = "hw.network"}, {type= "selector", dimension= "host.type", value= "network.Element"}]}
aggregations = [
{type = "longSum", name = "intersight.fi.network.bandwidth.utilization.receive.count", fieldName = "hw.network.bandwidth.utilization_receive_count"},
{type = "doubleSum", name = "hw.network.bandwidth.utilization_receive-Sum", fieldName = "hw.network.bandwidth.utilization_receive"},
{type = "doubleMin", name = "intersight.network.bandwidth.utilization.receive.min", fieldName = "hw.network.bandwidth.utilization_receive_min"},
{type = "doubleMax", name = "intersight.network.bandwidth.utilization.receive.max", fieldName = "hw.network.bandwidth.utilization_receive_max"},
{type = "longSum", name = "intersight.fi.network.bandwidth.utilization.transmit.count", fieldName = "hw.network.bandwidth.utilization_transmit_count"},
{type = "doubleSum", name = "hw.network.bandwidth.utilization_transmit-Sum", fieldName = "hw.network.bandwidth.utilization_transmit"},
{type = "doubleMin", name = "intersight.network.bandwidth.utilization.transmit.min",fieldName = "hw.network.bandwidth.utilization_transmit_min"},
{type = "doubleMax", name = "intersight.network.bandwidth.utilization.transmit.max",fieldName = "hw.network.bandwidth.utilization_transmit_max"}
]
post_aggregations = [
{"type" = "expression", "name" = "intersight.network.bandwidth.utilization.receive.avg", "expression" = "(\"hw.network.bandwidth.utilization_receive-Sum\" / \"intersight.fi.network.bandwidth.utilization.receive.count\")"},
{"type" = "expression", "name" = "intersight.network.bandwidth.utilization.transmit.avg", "expression" = "(\"hw.network.bandwidth.utilization_transmit-Sum\" / \"intersight.fi.network.bandwidth.utilization.transmit.count\")"}
]
field_names = [
"intersight.network.bandwidth.utilization.receive.avg",
"intersight.network.bandwidth.utilization.receive.min",
"intersight.network.bandwidth.utilization.receive.max",
"intersight.network.bandwidth.utilization.transmit.avg",
"intersight.network.bandwidth.utilization.transmit.min",
"intersight.network.bandwidth.utilization.transmit.max"
]
otel_dimension_to_attribute_map = {"host.name" = "intersight.host.name", "host.type" = "intersight.host.type","host.id" = "intersight.host.id"}
